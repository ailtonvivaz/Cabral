name: Bug report
description: Something routes or behaves incorrectly
labels: [bug]
body:
  - type: input
    id: macos
    attributes: { label: macOS version, placeholder: "26.1" }
    validations: { required: true }
  - type: input
    id: version
    attributes: { label: Cabral version, description: "Launch Cabral again to open Settings, then Cabral › About Cabral" }
    validations: { required: true }
  - type: dropdown
    id: install
    attributes: { label: Install method, options: [DMG from Releases, Built from source] }
  - type: input
    id: browsers
    attributes: { label: Target browser(s) and versions }
  - type: dropdown
    id: running
    attributes: { label: Was the target browser already running?, options: ["Yes", "No", Happens in both cases] }
  - type: input
    id: source
    attributes: { label: App the link came from, placeholder: "Slack, Teams, Terminal `open`…" }
  - type: input
    id: url
    attributes: { label: Example URL, description: Redact anything sensitive. }
  - type: textarea
    id: steps
    attributes: { label: Steps to reproduce, expected and actual behaviour }
    validations: { required: true }
  - type: textarea
    id: rules
    attributes: { label: Relevant rules from config.json, description: Redact your domains if needed., render: json }
  - type: checkboxes
    id: searched
    attributes:
      label: Checks
      options:
        - label: I searched existing issues.
          required: true
